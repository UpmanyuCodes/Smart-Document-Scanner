# Shared look. Colours live in [theme.light] / [theme.dark]; with both defined
# the app follows the device's light/dark setting automatically.
[theme]
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
baseRadius = "12px"
buttonRadius = "14px"
showWidgetBorder = false

[theme.light]
primaryColor = "#007AFF"
backgroundColor = "#F2F2F7"
secondaryBackgroundColor = "#E9E9EE"
textColor = "#000000"
borderColor = "#D9D9DE"

[theme.dark]
primaryColor = "#0A84FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#2C2C2E"
textColor = "#FFFFFF"
borderColor = "#38383A"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
maxUploadSize = 40

[browser]
gatherUsageStats = false
